# MCP-Linx configuration
# Конфигурация плагинов и окружения

# NOTE (wave 6, 2026-09-18): секция `environment:` (mode/debug) удалена —
# код её не читал. Уровень логирования задаётся в одном месте:
# env LOG_LEVEL → `Settings.log_level` → `logging.basicConfig` (main.py:49-53).

# Multi-host: удалённые хосты для диагностики по SSH.
# Инструменты linux_*/nginx_* (кроме nginx_stub_status)/systemd_* принимают
# параметр host: <имя из списка>.
# Поле password — не хранить в файле; переопределяйте через env.
# E1: retry_attempts / retry_backoff_seconds работают и в hosts.<имя>, и в
# plugins.<плагин>.ssh (дефолты 2 и 0.5); повтор только на ошибках соединения.
hosts: {}
# hosts:
#   web-1:
#     host: 10.130.0.23
#     port: 22
#     username: user
#     key_file: ~/.ssh/id_rsa
#     password: null
#     host_key_policy: reject   # reject | warning | auto_add
#     known_hosts: null
#     # E3 (бастион, опционально): сессия до target идёт через direct-tcpip канал
#     # jump_host: bastion.example.com
#     # jump_port: 22
#     # jump_username: jumper
#     # jump_key_file: ~/.ssh/jump
#   db-1:
#     host: 10.130.0.24
#     username: user
#     key_file: ~/.ssh/id_rsa

security:
  readonly: true
  max_command_output_size: 10000  # байт
  max_log_lines: 500
  max_search_results: 100
  # A9: дефолтный таймаут команд плагинов (сек) — применяется в `_run*` плагинов
  # (linux, nginx, systemd, kubernetes, netdiag, redis), когда инструмент не передал
  # таймаут явно; explicit per-tool timeout его перекрывает. Путь:
  # SecurityGuard.command_timeout → DiagnosticPlugin.command_timeout → execute_command.
  command_timeout_seconds: 30
  # Rate limiting: скользящее окно на инструмент (реализован в ratelimit.py,
  # применяется в agent_loop._make_handler; A9 — ключи живые, не заглушки).
  rate_limit_max_calls: 60        # вызовов на инструмент за окно
  rate_limit_window_seconds: 60   # окно в секундах
  # Имена реестра hosts, которым разрешены вызовы через параметр host
  # (проверяется SecurityGuard.validate_host до резолва адаптера; A3).
  # Пустой список [] = без ограничений (multi-host свободный).
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"

telemetry:
  audit_log: true
  # Путь к файлу аудита. Дефолт /var/log/mcp-linx/audit.log неписуем внутри
  # контейнера (A6) — AuditLogger молча деградирует в stderr-warn; для файла
  # смонтируйте том (-v ./logs:/var/log/mcp-linx) либо задайте свой путь.
  audit_log_file: "/var/log/mcp-linx/audit.log"

# Активный набор плагинов: только перечисленные ниже загружаются и
# инициализируются, их инструменты регистрируются в MCP и они участвуют в
# health-check. Пустой список или отсутствие ключа = все обнаруженные плагины.
# Это состав, а не граница доступа (см. README → Security).
# NOTE (wave 6, 2026-09-18): per-plugin ключи `enabled: true` удалены — код их
# не читал; единственный переключатель состава — этот список.
plugins:
  enabled:
    - linux
    - nginx
    - docker
    - postgres
    - redis
    - systemd
    - netdiag
    - kubernetes
    - prometheus
    - loki

  linux:
    # Если SSH не указан — используется локальный хост
    ssh:
      host: null          # null = localhost
      port: 22
      username: null      # null = текущий пользователь
      key_file: null      # null = default keys
      password: null      # не рекомендуется
      host_key_policy: "reject"  # reject | warning | auto_add (защита от MITM)
      known_hosts: null   # путь к known_hosts (null = системный ~/.ssh/known_hosts)

  nginx:
    config_path: "/etc/nginx/nginx.conf"
    log_path: "/var/log/nginx"
    access_log: "access.log"
    error_log: "error.log"
    # Подключение к stub_status (если настроен)
    stub_status_url: null  # например: "http://127.0.0.1/nginx_status"
    ssh:
      host: null
      port: 22
      username: null
      key_file: null

  docker:
    # Docker socket или remote API
    host: "unix:///var/run/docker.sock"  # или "tcp://docker-host:2375"
    timeout_seconds: 10
    # Фильтры по умолчанию
    filters:
      status: "running"  # по умолчанию показывать running контейнеры

  postgres:
    # Подключение к PostgreSQL
    host: "localhost"
    port: 5432
    database: "postgres"
    user: "postgres"
    password: "${POSTGRES_PASSWORD:-}"  # A4: раскрывается из env при загрузке
    ssl_mode: "prefer"  # disable, allow, prefer, require, verify-ca, verify-full
    # Лимиты
    max_connections_query: 100
    slow_query_threshold_ms: 1000
    # SSH tunnel (опционально, E2)
    # РЕАЛИЗОВАНО: ssh.host + ssh.tunnel: true → локальный форвард до host:port
    # через SSH-сервер; решает случай «БД доступна только с bastion-хоста».
    # При туннеле verify-full проверяет адрес туннеля — предпочтителен verify-ca.
    ssh:
      host: null
      port: 22
      username: null
      key_file: null
      tunnel: false        # true = поднять локальный порт-форвардинг (требует host)
    # E4b (опционально): именованные таргеты — `pg_*` принимают `host: <имя>`.
    # Каждый таргет получает свой коннект (и туннель при ssh.tunnel: true);
    # неуказанные поля наследуются от настроек плагина выше.
    # targets:
    #   replica:
    #     host: replica.db
    #   behind-bastion:
    #     host: internal.db
    #     ssh: {host: bastion, tunnel: true}

  redis:
    host: "localhost"
    port: 6379
    password: "${REDIS_PASSWORD:-}"  # A4: раскрывается из env при загрузке
    ssh:
      host: null
      port: 22
      username: null
      key_file: null

  systemd:
    ssh:
      host: null
      port: 22
      username: null
      key_file: null

  netdiag:
    timeout_seconds: 15
    privileged_tools: false  # tcp_connect_as / tcpdump_probe (runuser, tcpdump) — только чтение с лимитами

  kubernetes:
    namespace: "default"
    kubeconfig: null  # null = ~/.kube/config
    context: null     # null = current-context
    ssh:
      host: null
      port: 22
      username: null
      key_file: null

  prometheus:
    base_url: "http://localhost:9090"
    timeout_seconds: 20
    token: "${PROMETHEUS_TOKEN:-}"  # A4 (если требуется)

  loki:
    base_url: "http://localhost:3100"
    timeout_seconds: 20
    token: "${LOKI_TOKEN:-}"  # A4 (если требуется)

# NOTE (A7, FIXED 2026-09-17): секция `logging:` УДАЛЕНА — её никто не читал
# (нет `logging.config.dictConfig`), а `structlog` вычищен из зависимостей.
# Единственная точка настройки логирования: `Settings.log_level` (env `LOG_LEVEL`)
# → `logging.basicConfig` в `main.py:49-53`. Если понадобится dictConfig —
# восстанавливайте секцию вместе с кодом, который её применяет.
