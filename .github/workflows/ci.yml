name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      # B9: third-party actions пиннятся по commit SHA (тег может быть переопределён).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src/mcp_linx --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # B6: classifiers заявляют 3.11–3.13 — матрица должна их покрывать.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests + coverage gate
        # B3: line + branch coverage; порог повышаем вместе с тестами.
        run: pytest tests/unit -q --cov=mcp_linx --cov-report=term-missing --cov-fail-under=60
      - name: Import / discovery check
        run: |
          python -c "
          import logging; logging.disable(logging.CRITICAL)
          from mcp_linx.harness.plugin_manager import PluginManager, discover_plugins
          n = discover_plugins()
          pm = PluginManager({}); pm.load_plugins()
          print(f'plugins: {n} | tools: {len(pm.get_tools())}')
          # B5: точные счётчики (было >= 10 / >= 50) — ловят дрейф плагинов/инструментов
          assert n == 10, f'plugin count drift: {n} != 10'
          assert len(pm.get_tools()) == 56, f'tool count drift: {len(pm.get_tools())} != 56'
          "

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration prerequisites
        run: |
          docker info
          docker compose version
          sudo apt-get update
          sudo apt-get install -y redis-tools
          redis-cli --version
      # B4: postgres/nginx/redis поднимаются фикстурой tests/integration/conftest.py
      # (docker compose -f tests/docker-compose.test.yml up -d) и гасятся в teardown.
      - name: Integration tests (Docker compose)
        run: pytest -m integration -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks требует полную историю
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bandit (SAST — статический анализ кода)
        run: bandit -c pyproject.toml -r src/mcp_linx
      - name: pip-audit (уязвимости зависимостей, CVE)
        run: pip-audit --skip-editable
      - name: Gitleaks (секреты в коде и истории)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: mcp-linx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — MCP initialize по stdio
        run: |
          resp=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm mcp-linx:ci)
          echo "$resp" | head -1
          echo "$resp" | grep -q '"serverInfo"' && echo "MCP stdio OK"
      - name: Trivy — скан образа (CVE + секреты)
        # ВАЖНО: у aquasecurity/trivy-action все теги идут с префиксом "v".
        # Ref без префикса (0.24.0) не существует → "unable to resolve action".
        # B9: версия v0.36.0 запинена по SHA (релизы помечены immutable).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-linx:ci
          # fail только на CVE с реальным upstream-патчем. Без ignore-unfixed
          # Trivy рубит CI на "no-fix" HIGH/CRITICAL из Debian trixee (утилиты
          # модели A), которые нельзя починить в образе без замены пакета.
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Загрузить отчёт Trivy (для triage)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
