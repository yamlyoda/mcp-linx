name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src/mcp_linx --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Import / discovery check
        run: |
          python -c "
          import logging; logging.disable(logging.CRITICAL)
          from mcp_linx.harness.plugin_manager import PluginManager, discover_plugins
          n = discover_plugins()
          pm = PluginManager({}); pm.load_plugins()
          print(f'plugins: {n} | tools: {len(pm.get_tools())}')
          assert n >= 10 and len(pm.get_tools()) >= 50
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks требует полную историю
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bandit (SAST — статический анализ кода)
        run: bandit -c pyproject.toml -r src/mcp_linx
      - name: pip-audit (уязвимости зависимостей, CVE)
        run: pip-audit --skip-editable
      - name: Gitleaks (секреты в коде и истории)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-linx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — MCP initialize по stdio
        run: |
          resp=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm mcp-linx:ci)
          echo "$resp" | head -1
          echo "$resp" | grep -q '"serverInfo"' && echo "MCP stdio OK"
      - name: Trivy — скан образа (CVE + секреты)
        # ВАЖНО: у aquasecurity/trivy-action все теги идут с префиксом "v".
        # Ref без префикса (0.24.0) не существует → "unable to resolve action".
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-linx:ci
          # fail только на CVE с реальным upstream-патчем. Без ignore-unfixed
          # Trivy рубит CI на "no-fix" HIGH/CRITICAL из Debian trixee (утилиты
          # модели A), которые нельзя починить в образе без замены пакета.
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Загрузить отчёт Trivy (для triage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
